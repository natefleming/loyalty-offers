[project]
name = "loyalty-offers"
version = "0.1.0"
description = "Tractor Supply loyalty-offers GPU batch inference DAB"
requires-python = ">=3.10"
dependencies = []

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]
